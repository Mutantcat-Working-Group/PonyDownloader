name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        # Iterations use the current date without -1/-2 suffixes: v1.0.20260926, v1.0.20261007, ...
        description: "Release tag to build, e.g. v1.0.20260925"
        required: false
        default: "v1.0.20261007"

env:
  GO_VERSION: "1.25.4"
  FLUTTER_VERSION: "3.41.6"
  # Version strategy: advance the date each iteration, never append -1/-2.
  TAG: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.20261007' }}

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }} NSIS installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            flutter_arch: x64
            runner: windows-latest
            flutter_channel: stable
            flutter_version: "3.41.6"
          - arch: arm64
            goarch: arm64
            flutter_arch: arm64
            runner: windows-11-arm
            flutter_channel: main
            flutter_version: "7e1c8868"
    steps:
      - name: Enable long paths on Windows
        shell: pwsh
        run: |
          git config --system core.longpaths true
          fsutil behavior set disable8dot3 1

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter_channel }}
          flutter-version: ${{ matrix.flutter_version }}

      - name: Install llvm-mingw-ucrt-aarch64 (ARM64 only)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "20251202"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/llvm-mingw-$ver-ucrt-aarch64.zip"
          $zip = "$env:RUNNER_TEMP\llvm.zip"
          $extract = "$env:RUNNER_TEMP\extract"
          $target = "C:\clangarm64"

          curl -L $url -o $zip
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract, $target
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          tar -xf $zip -C $extract
          Move-Item (Get-ChildItem $extract)[0].FullName $target

          $b = "$target\bin"
          "CC=$b\clang.exe"        | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=$b\clang++.exe"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANGARM64_BIN=$b"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CGO_ENABLED=1"           | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANGARM64_ROOT=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $b | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Windows app (${{ matrix.arch }})
        shell: pwsh
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG -replace '^v', ''
          $ldflags = "-w -s -X github.com/GopeedLab/gopeed/pkg/base.Version=$version"
          go build -tags nosqlite -ldflags="$ldflags" -buildmode=c-shared -o ui/flutter/windows/libgopeed.dll github.com/GopeedLab/gopeed/bind/desktop
          go build -ldflags="$ldflags" -o ui/flutter/assets/exec/host.exe github.com/GopeedLab/gopeed/cmd/host
          go build -ldflags="$ldflags" -o ui/flutter/assets/exec/updater.exe github.com/GopeedLab/gopeed/cmd/updater

          cd ui/flutter
          flutter build windows --release --dart-define=UPDATE_CHANNEL=windowsInstaller

          $release = Join-Path (Get-Location) "build\windows\${{ matrix.flutter_arch }}\runner\Release"
          if ($env:CLANGARM64_ROOT) {
            $runtimeDlls = @(
              "$env:CLANGARM64_ROOT\bin\libstdc++-6.dll",
              "$env:CLANGARM64_ROOT\bin\libgcc_s_seh-1.dll",
              "$env:CLANGARM64_ROOT\bin\libwinpthread-1.dll",
              "$env:SystemRoot\System32\msvcp140.dll",
              "$env:SystemRoot\System32\vcruntime140.dll",
              "$env:SystemRoot\System32\vcruntime140_1.dll"
            )
          } else {
            $runtimeDlls = @(
              "$env:ProgramFiles\Git\mingw64\bin\libstdc++-6.dll",
              "$env:ProgramFiles\Git\mingw64\bin\libgcc_s_seh-1.dll",
              "$env:ProgramFiles\Git\mingw64\bin\libwinpthread-1.dll",
              "$env:SystemRoot\System32\msvcp140.dll",
              "$env:SystemRoot\System32\vcruntime140.dll",
              "$env:SystemRoot\System32\vcruntime140_1.dll"
            )
          }
          foreach ($dll in $runtimeDlls) {
            if (Test-Path $dll) {
              Copy-Item $dll $release -Force
            }
          }

          New-Item -ItemType Directory -Force -Path "build\windows\Output" | Out-Null

      # The NSIS installer embeds the release directory as-is, so every binary
      # has to carry its self-signed signature before makensis runs.
      - name: Create Windows code-signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'mutantcat-code-signing.pfx'
          $password = 'mutantcat'
          $cert = New-SelfSignedCertificate `
            -Subject 'CN=Mutantcat Working Group, O=Mutantcat Working Group, C=CN' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyUsage DigitalSignature `
            -Type CodeSigningCert `
            -KeyExportPolicy Exportable `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10)
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $signtool = $null
          foreach ($kit in (Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory | Sort-Object Name -Descending)) {
            $candidate = Join-Path $kit.FullName 'x64\signtool.exe'
            if (Test-Path $candidate) { $signtool = $candidate; break }
          }
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PFX_PATH -or -not $env:SIGNTOOL_PATH) { throw 'code-signing setup did not run' }
          $release = Join-Path (Get-Location) "ui\flutter\build\windows\${{ matrix.flutter_arch }}\runner\Release"
          $targets = @()
          $targets += Get-ChildItem $release -Filter 'PonyDownloader.exe' -File
          $targets += Get-ChildItem $release -Filter '*.dll' -File
          $targets += Get-ChildItem (Join-Path (Get-Location) 'ui\flutter\windows') -Filter '*.dll' -File -ErrorAction SilentlyContinue
          $targets += Get-ChildItem (Join-Path $release 'data') -Recurse -Include '*.exe' -File -ErrorAction SilentlyContinue
          if ($targets.Count -eq 0) { throw "no signable binary under $release" }
          foreach ($target in $targets) {
            & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:PFX_PATH /p $env:SIGN_PASSWORD /d 'PonyDownloader' "$($target.FullName)"
            $signature = Get-AuthenticodeSignature $target.FullName
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notlike '*CN=Mutantcat Working Group*') {
              throw "$($target.Name) lost its signature ($($signature.Status))"
            }
            echo "signed $($target.Name)"
          }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $root = Get-Location
          $release = Join-Path $root "ui\flutter\build\windows\${{ matrix.flutter_arch }}\runner\Release"
          $output = Join-Path $root 'ui\flutter\build\windows\Output'
          $icon = Join-Path $root 'ui\flutter\assets\icon\icon.ico'
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($makensis) {
            $makensisPath = $makensis.Source
          } else {
            $makensisPath = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          & $makensisPath "/DVERSION=$version" "/DRELEASE_DIR=$release" "/DOUTPUT_DIR=$output" "/DICON_FILE=$icon" "ui\flutter\windows\installer\ponydownloader.nsi"
          Get-ChildItem $output

      - name: Sign and verify Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PFX_PATH -or -not $env:SIGNTOOL_PATH) { throw 'code-signing setup did not run' }
          $output = Join-Path (Get-Location) 'ui\flutter\build\windows\Output'
          $installers = @(Get-ChildItem $output -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw "no NSIS installer under $output" }
          foreach ($installer in $installers) {
            & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:PFX_PATH /p $env:SIGN_PASSWORD /d 'PonyDownloader Installer' "$($installer.FullName)"
          }
          $release = Join-Path (Get-Location) "ui\flutter\build\windows\${{ matrix.flutter_arch }}\runner\Release"
          $app = Join-Path $release 'PonyDownloader.exe'
          $appSignature = Get-AuthenticodeSignature $app
          if (-not $appSignature.SignerCertificate -or $appSignature.SignerCertificate.Subject -notlike '*CN=Mutantcat Working Group*') {
            throw "$app lost its signature ($($appSignature.Status))"
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notlike '*CN=Mutantcat Working Group*') {
              throw "$($installer.Name) lost its signature ($($signature.Status))"
            }
            echo "signed $($installer.Name)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.arch }}
          path: ui/flutter/build/windows/Output/

  macos:
    name: macOS ${{ matrix.arch }} DMG (ad-hoc)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Native builds per architecture: GitHub Intel runners + arm64 runners.
        include:
          - arch: arm64
            goarch: arm64
            runner: macos-14
          - arch: x64
            goarch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build Go libraries (${{ matrix.goarch }})
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p ui/flutter/macos/Frameworks ui/flutter/assets/exec
          export CGO_ENABLED=1
          go build -tags nosqlite -ldflags="-w -s -X github.com/GopeedLab/gopeed/pkg/base.Version=${version}" -buildmode=c-shared -o ui/flutter/macos/Frameworks/libgopeed.dylib github.com/GopeedLab/gopeed/bind/desktop
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/host github.com/GopeedLab/gopeed/cmd/host
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/updater github.com/GopeedLab/gopeed/cmd/updater

      - name: Build macOS app
        run: |
          cd ui/flutter
          flutter build macos --release --dart-define=UPDATE_CHANNEL=macosDmg

      - name: Ad-hoc sign and create DMG
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          products=ui/flutter/build/macos/Build/Products/Release
          app="$products/PonyDownloader.app"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'

          cd "$products"
          dmg_root=PonyDownloaderDmgRoot
          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          cp -R PonyDownloader.app "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"
          codesign --force --deep --sign - --timestamp=none "$dmg_root/PonyDownloader.app"
          hdiutil create -volname PonyDownloader -srcfolder "$dmg_root" -ov -format UDZO "PonyDownloader-v${version}-macos-${ARCH}.dmg"
          codesign --sign - "PonyDownloader-v${version}-macos-${ARCH}.dmg"
          rm -rf "$dmg_root"

      - name: Verify macOS DMG
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          products=ui/flutter/build/macos/Build/Products/Release
          dmg="$products/PonyDownloader-v${version}-macos-${ARCH}.dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          codesign -dv "$dmg" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil verify "$dmg"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          test -L "$mount/Applications"
          test -d "$mount/PonyDownloader.app"
          # The bundled binary has to be ad-hoc signed too, not just the image.
          codesign --verify --deep --strict "$mount/PonyDownloader.app"
          codesign -dv "$mount/PonyDownloader.app" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil detach "$mount"
          rmdir "$mount"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: ui/flutter/build/macos/Build/Products/Release/PonyDownloader-*.dmg

  linux:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          # Upstream limit: Flutter publishes no arm64 Linux desktop archive
          # ("Unable to determine Flutter version ... architecture: arm64"), so an
          # arm64 AppImage cannot be built until Flutter ships one.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libkeybinder-3.0-dev patchelf libfuse2 xz-utils zip unzip

      - name: Install appimagetool
        run: |
          set -euo pipefail
          arch=$(uname -m)
          wget -qO appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Build AppImage
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          go build -tags nosqlite -ldflags="-w -s -X github.com/GopeedLab/gopeed/pkg/base.Version=${version}" -buildmode=c-shared -o ui/flutter/linux/bundle/lib/libgopeed.so github.com/GopeedLab/gopeed/bind/desktop
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/host github.com/GopeedLab/gopeed/cmd/host
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/updater github.com/GopeedLab/gopeed/cmd/updater

          cd ui/flutter
          cat > distribute_options.yaml <<'EOF'
          output: dist/
          releases:
            - name: linux
              jobs:
                - name: appimage
                  package:
                    platform: linux
                    target: appimage
                    build_args:
                      dart-define:
                        UPDATE_CHANNEL: linuxAppImage
          EOF
          dart pub global activate -sgit https://github.com/GopeedLab/flutter_distributor.git --git-path packages/flutter_distributor
          flutter_distributor release --name linux
          cd dist/*
          mv ./*-linux.AppImage "PonyDownloader-v${version}-linux-${ARCH}.AppImage"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: ui/flutter/dist/*/PonyDownloader-*.AppImage

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [windows, macos, linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f | sort

      - name: Flatten artifact directories
        run: |
          cd release-assets
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -type d -empty -delete

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name 'checksums*.txt' -printf '%f\n')
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          sha256sum "${files[@]}" > checksums.txt
          md5sum "${files[@]}" > checksums-md5.txt
          sha1sum "${files[@]}" > checksums-sha1.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PonyDownloader ${{ env.TAG }}
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/checksums*.txt
          overwrite_files: true
